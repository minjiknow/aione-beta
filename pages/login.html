<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>AI-ONE 로그인</title>

	<script src="../js/ai-theme.js"></script>
	<link rel="stylesheet" href="../css/ai-theme.css" />
	<link rel="stylesheet" href="../css/common.css" />
	<link rel="stylesheet" href="../css/login.css" />
</head>

<body>
	<!-- Start: 로그인 배경 -->
	<div class="ai-one-background ai-one-background-login" aria-hidden="true">
		<span class="ai-one-background-part ai-one-background-login-orb ai-one-background-login-orb-one"></span>
		<span class="ai-one-background-part ai-one-background-login-orb ai-one-background-login-orb-two"></span>
		<span class="ai-one-background-part ai-one-background-login-orb ai-one-background-login-orb-three"></span>
		<span class="ai-one-background-part ai-one-background-login-orb ai-one-background-login-orb-four"></span>
		<span class="ai-one-background-part ai-one-background-login-ring ai-one-background-login-ring-one"></span>
		<span class="ai-one-background-part ai-one-background-login-ring ai-one-background-login-ring-two"></span>
		<span class="ai-one-background-part ai-one-background-login-ring ai-one-background-login-ring-three"></span>
		<span class="ai-one-background-part ai-one-background-login-flare"></span>
	</div>
	<!-- //End: 로그인 배경 -->

	<!---------------------------------------- Start: 로그인 카드 ---------------------------------------->
	<div class="login-wrap">
		<div class="login-card">
			<!-- Start: 로그인 로고 영역 -->
			<div class="login-logo">
				<svg class="login-symbol hidden" viewBox="0 0 32 32" aria-hidden="true">
					<defs>
						<linearGradient id="lg1" x1="0%" y1="0%" x2="100%" y2="100%">
							<stop offset="0%" stop-color="#4dd9c0" />
							<stop offset="100%" stop-color="#0969da" />
						</linearGradient>
						<linearGradient id="lg2" x1="0%" y1="0%" x2="100%" y2="100%">
							<stop offset="0%" stop-color="#38bdf8" />
							<stop offset="100%" stop-color="#1e3a5f" />
						</linearGradient>
						<linearGradient id="lg3" x1="100%" y1="0%" x2="0%" y2="100%">
							<stop offset="0%" stop-color="#0ea5e9" />
							<stop offset="100%" stop-color="#1e40af" />
						</linearGradient>
						<linearGradient id="lg4" x1="0%" y1="100%" x2="100%" y2="0%">
							<stop offset="0%" stop-color="#1e3a5f" />
							<stop offset="100%" stop-color="#0284c7" />
						</linearGradient>
					</defs>
					<path
						d="M16 6C16 6 12 2 8 4C4 6 4 11 6 14C8 17 16 16 16 16C16 16 10 14 8 11C6 8 8 5 11 5C14 5 16 6 16 6Z"
						fill="url(#lg1)" />
					<path
						d="M26 16C26 16 30 12 28 8C26 4 21 4 18 6C15 8 16 16 16 16C16 16 18 10 21 8C24 6 27 8 27 11C27 14 26 16 26 16Z"
						fill="url(#lg3)" />
					<path
						d="M16 26C16 26 20 30 24 28C28 26 28 21 26 18C24 15 16 16 16 16C16 16 22 18 24 21C26 24 24 27 21 27C18 27 16 26 16 26Z"
						fill="url(#lg2)" />
					<path
						d="M6 16C6 16 2 20 4 24C6 28 11 28 14 26C17 24 16 16 16 16C16 16 14 22 11 24C8 26 5 24 5 21C5 18 6 16 6 16Z"
						fill="url(#lg4)" />
				</svg>
				<img class="login-symbol" src="../images/logo.svg" alt="" aria-hidden="true" />
				<h1 class="login-title">AI-ONE</h1>
				<p class="login-subtitle">재정경제부 AI 플랫폼</p>
			</div>
			<!-- //End: 로그인 로고 영역 -->

			<!-- Start: 로그인 입력 폼 -->
			<form class="login-form" id="loginForm">
				<div class="form-group">
					<label for="userId">아이디</label>
					<input type="text" id="userId" class="form-input" placeholder="아이디를 입력하세요"
						autocomplete="username" />
				</div>
				<div class="form-group">
					<label for="userPw">비밀번호</label>
					<input type="password" id="userPw" class="form-input" placeholder="비밀번호를 입력하세요"
						autocomplete="current-password" />
				</div>
				<div class="form-options">
					<label class="checkbox-label">
						<input class="checkbox-control checkbox-control-sm" type="checkbox" id="rememberMe" />
						<span>아이디 저장</span>
					</label>
				</div>
				<button type="submit" class="login-btn">로그인</button>
			</form>
			<!-- //End: 로그인 입력 폼 -->

			<!-- Start: 로그인 하단 기관 정보 -->
			<div class="login-footer">
				<span>© 2026 AI-ONE Platform.</span>
				<img class="login-footer-mofe" src="../assets/images/logo-mofe.png" alt="재정경제부" />
			</div>
			<!-- //End: 로그인 하단 기관 정보 -->
		</div>
	</div>
	<!---------------------------------------- //End: 로그인 카드 ---------------------------------------->

	<div class="ai-one-notification-toast" aria-live="polite">
		<div class="ai-one-notification-icon">✓</div>
		<div class="ai-one-notification-copy"><strong></strong><span></span></div><button type="button"
			aria-label="알림 닫기">×</button>
	</div>
	<div id="aiOneTooltip" class="ai-one-tooltip" role="tooltip" hidden></div>
	<div id="userProfileHoverTooltip" class="user-profile-hover-tooltip hidden" role="tooltip"><strong>담당자
			기본정보</strong><span data-profile-name>박재정 주무관</span><span data-profile-department>재정분석과</span><em
			data-profile-role>국회담당자</em></div>
	<script src="../js/common.js"></script>
	<script src="../js/login.js"></script>
</body>

</html>
